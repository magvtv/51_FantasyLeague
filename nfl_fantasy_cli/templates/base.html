<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NFL Fantasy League{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="navbar-brand">
            <i class="fas fa-football-ball"></i> NFL Fantasy
        </a>
        <div class="navbar-nav">
            <a href="{{ url_for('index') }}" class="nav-link">Dashboard</a>
            <a href="{{ url_for('leaderboard') }}" class="nav-link">Leaderboard</a>
            <a href="{{ url_for('teams') }}" class="nav-link">Teams</a>
            <a href="{{ url_for('players') }}" class="nav-link">Players</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>&copy; 2024 NFL Fantasy League CLI Web Interface</p>
    </footer>
</body>
</html>
